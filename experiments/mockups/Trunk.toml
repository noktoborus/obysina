# `make mockups` builds the mockups with trunk into a module of a desk of
# /workspace/showcase, with addresses relative to the page; `trunk build`
# alone builds them here.
[build]
target = "index.html"
dist = "../../target/mockups-site"
cargo_profile = "mockups"
offline = true

[tools]
# The wasm-bindgen of /opt/packages.sh: trunk downloads nothing.
wasm_bindgen = "0.2.129"
