# A workspace of its own, left out of the one of obusina: it depends on
# showcase, a project beside obusina, which a clone of obusina alone has not.
# obusina builds without it.
[workspace]

[workspace.dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
log = "0.4"
palette = "0.7"
serde_json = "1.0"

obusina-button = { path = "../../crates/obusina-button" }
plate-menu = { path = "../../crates/plate-menu" }
# The gallery of the mockups, a project of its own beside obusina.
showcase = { path = "../../../showcase", version = "0.1.0" }

# The wasm of the mockups: the release of obusina, fat LTO in one unit of
# code. The module is smaller to load over a slow line, and runs faster on a
# small machine such as a Raspberry Pi.
[profile.mockups]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[package]
name = "mockups"
description = "Mockups of the design of the window, shown in the gallery of showcase"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[[bin]]
name = "mockups"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
log.workspace = true
obusina-button.workspace = true
palette.workspace = true
plate-menu.workspace = true
serde_json.workspace = true
showcase.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }
