# The builds of the program, called by ci.yml on every push and by
# release.yml on a tag of a version. Each job leaves its result as an
# artifact of the run: the program for Windows, the package of android and
# the site of the browser.
#
# The package of android is signed only when `signed` is true, with the key
# of the secrets of the repository:
#   OBUSINA_KEYSTORE_BASE64    the keystore, in base64
#   OBUSINA_KEYSTORE_PASSWORD  its password
#   OBUSINA_KEY_ALIAS          the alias of the key in it
#   OBUSINA_KEY_PASSWORD       the password of the key
# Without `signed` it is the unsigned release of `make apk-release`.

name: build

on:
  workflow_call:
    inputs:
      signed:
        description: Sign the package of android with the key of the secrets.
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # The versions of android/app/build.gradle.kts and of the Makefile.
  ANDROID_PLATFORM: platforms;android-37
  ANDROID_NDK: ndk;30.0.16248370
  ANDROID_BUILD_TOOLS: build-tools;36.0.0

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: mingw, whose windres compiles the icon
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: make build-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/x86_64-pc-windows-gnu/release/obusina.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: the SDK and the NDK of the package
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_PLATFORM" "$ANDROID_NDK" "$ANDROID_BUILD_TOOLS"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK#ndk;}" >> "$GITHUB_ENV"
      - run: cargo install cargo-ndk --locked
      - name: the key of the release, from the secrets
        if: inputs.signed
        env:
          KEYSTORE: ${{ secrets.OBUSINA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "no OBUSINA_KEYSTORE_BASE64 in the secrets"; exit 1; }
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "OBUSINA_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: make apk-release
        env:
          OBUSINA_KEYSTORE_PASSWORD: ${{ inputs.signed && secrets.OBUSINA_KEYSTORE_PASSWORD || '' }}
          OBUSINA_KEY_ALIAS: ${{ inputs.signed && secrets.OBUSINA_KEY_ALIAS || '' }}
          OBUSINA_KEY_PASSWORD: ${{ inputs.signed && secrets.OBUSINA_KEY_PASSWORD || '' }}
        run: make apk-release
      - name: the signature
        if: inputs.signed
        run: |
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS#build-tools;}/apksigner" \
            verify --print-certs target/obusina-release.apk
      - name: the key leaves the runner
        if: always() && inputs.signed
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: target/obusina-release.apk
          if-no-files-found: error

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.0
      - name: make web; trunk fetches wasm-bindgen and wasm-opt
        run: make web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: target/web
          if-no-files-found: error
