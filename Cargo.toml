[workspace]
members = ["android", "crates/*", "experiments/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
base64 = "0.23"
directories = "6.0"
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
embed-resource = "3.0"
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
env_logger = "0.11"
ico = "0.6"
log = "0.4"
nucleo-matcher = "0.3"
palette = "0.7"
resvg = { version = "0.48", default-features = false }
rust-i18n = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sys-locale = "0.3"
tempfile = "3.27"
thiserror = "2.0"
uuid = { version = "1.29", features = ["v4"] }
winit = { version = "0.30", default-features = false }

obusina = { path = ".", version = "0.1.0" }
obusina-button = { path = "crates/obusina-button", version = "0.1.0" }
obusina-canvas = { path = "crates/obusina-canvas", version = "0.1.0" }
obusina-panel = { path = "crates/obusina-panel", version = "0.1.0" }
obusina-pattern = { path = "crates/obusina-pattern", version = "0.1.0" }
plate-menu = { path = "crates/plate-menu", version = "0.1.0" }
# The gallery of the mockups, a project of its own beside this one.
showcase = { path = "../showcase", version = "0.1.0" }

# The wasm of `experiments/mockups`: a build of `dev` with no debug
# information. The crates under it are optimised once; unoptimised, they
# make a module of tens of megabytes.
[profile.mockups]
inherits = "dev"
debug = false

[profile.mockups.package."*"]
opt-level = 1

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[package]
name = "obusina"
description = "Editor of bead patterns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
eframe.workspace = true
egui.workspace = true
env_logger.workspace = true
log.workspace = true
obusina-button.workspace = true
obusina-canvas.workspace = true
obusina-panel.workspace = true
obusina-pattern.workspace = true
directories.workspace = true
palette.workspace = true
plate-menu.workspace = true
rust-i18n.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
sys-locale.workspace = true
thiserror.workspace = true

[build-dependencies]
embed-resource.workspace = true
ico.workspace = true
resvg.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["android-game-activity"] }
winit.workspace = true

[dev-dependencies]
embed-resource = "3.0"
egui_kittest = { workspace = true, features = ["eframe"] }
tempfile.workspace = true
