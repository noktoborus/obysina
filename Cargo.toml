[workspace]
members = ["android", "crates/*", "experiments/glyphs"]
# A workspace of its own: it depends on showcase, a project beside this one.
exclude = ["experiments/mockups"]

[workspace.package]
version = "1.0.5"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
android_logger = "0.15"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6.0"
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
embed-resource = "3.0"
egui-notify = "0.24"
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
env_logger = "0.11"
futures = { version = "0.3", default-features = false, features = ["std", "async-await", "executor"] }
ico = "0.6"
jni = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
lzma-rs = "0.3"
ndk-context = "0.1"
nucleo-matcher = "0.3"
palette = "0.7"
pollster = "1.0"
resvg = { version = "0.48", default-features = false }
rfd = "0.17"
rust-i18n = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sys-locale = "0.3"
tar = { version = "0.4", default-features = false }
tempfile = "3.27"
thiserror = "2.0"
uuid = { version = "1.29", features = ["v4"] }
web-time = "1.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "Url", "Window"] }
winit = { version = "0.30", default-features = false }

obusina = { path = ".", version = "1.0.5" }
obusina-backdrop = { path = "crates/obusina-backdrop", version = "1.0.5" }
obusina-button = { path = "crates/obusina-button", version = "1.0.5" }
obusina-canvas = { path = "crates/obusina-canvas", version = "1.0.5" }
obusina-panel = { path = "crates/obusina-panel", version = "1.0.5" }
obusina-pattern = { path = "crates/obusina-pattern", version = "1.0.5" }
plate-menu = { path = "crates/plate-menu", version = "1.0.5" }
unifs = { path = "crates/unifs", version = "1.0.5" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[package]
name = "obusina"
description = "Editor of bead patterns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
eframe = { workspace = true, features = ["persistence"] }
egui.workspace = true
egui-notify.workspace = true
env_logger.workspace = true
futures.workspace = true
log.workspace = true
lzma-rs.workspace = true
image.workspace = true
obusina-backdrop.workspace = true
obusina-button.workspace = true
obusina-canvas.workspace = true
obusina-panel.workspace = true
obusina-pattern.workspace = true
directories.workspace = true
palette.workspace = true
plate-menu.workspace = true
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sys-locale.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
unifs.workspace = true
uuid.workspace = true
web-time.workspace = true

[build-dependencies]
embed-resource.workspace = true
ico.workspace = true
resvg.workspace = true

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
pollster.workspace = true
rfd.workspace = true

# The page of the browser, `make web`: the clock of the browser, the
# randomness of the browser for the identifiers of patterns, the file input.
[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { workspace = true, features = ["wasmbind"] }
rfd.workspace = true
uuid = { workspace = true, features = ["js"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android_logger.workspace = true
eframe = { workspace = true, features = ["android-game-activity"] }
jni.workspace = true
ndk-context.workspace = true
winit.workspace = true

[dev-dependencies]
embed-resource = "3.0"
egui_kittest = { workspace = true, features = ["eframe"] }
tempfile.workspace = true

# A copy of egui-notify 0.24.0 with an action button, in place of the one of
# crates.io (`RULE notify.patch` of AGENTS.md).
[patch.crates-io]
egui-notify = { path = "crates/egui-notify" }
